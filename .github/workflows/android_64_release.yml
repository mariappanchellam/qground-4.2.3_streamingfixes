# The 32 and 64 bit version of these actions should be kept in sync
name: Android 64-bit Release

on:
  push:
    branches:
      - 'master'
      - 'Stable*'
    tags:
      - 'v*'
  pull_request:
    branches:
    - '*'
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  SOURCE_DIR:   ${{ github.workspace }}
  QT_VERSION:   5.15.2
  ARTIFACT:     QGroundControl64.apk
  BUILD_TYPE:   ${{ fromJSON('["DailyBuild", "StableBuild"]')[ github.ref_type == 'tag' || contains(github.ref, 'Stable_' ) ] }}

jobs:
  build:
    runs-on:  ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get all tags for correct version determination
        working-directory:  ${{ github.workspace }}
        run: |
          git fetch --all --tags -f

      - name: Patch gst-plugins-good volatile gsize for clang
        working-directory: ${{ github.workspace }}
        run: |
          for f in \
            libs/qmlglsink/gst-plugins-good/ext/qt/gstqtglutility.cc \
            libs/qmlglsink/gst-plugins-good/ext/qt/gstqsgtexture.cc \
            libs/qmlglsink/gst-plugins-good/ext/qt/qtwindow.cc \
            libs/qmlglsink/gst-plugins-good/ext/qt/qtitem.cc; do
            sed -i 's/static volatile gsize/static gsize/g' "$f"
          done

      - name: Patch VideoReceiver.pri to add -Bsymbolic and -lpcre2-8 for arm64 GStreamer
        working-directory: ${{ github.workspace }}
        run: |
          sed -i 's/QMAKE_CXXFLAGS  += -pthread/QMAKE_CXXFLAGS  += -pthread\n        QMAKE_LFLAGS    += -Wl,-Bsymbolic/' \
            src/VideoReceiver/VideoReceiver.pri
          sed -i 's/-lglib-2.0 -lorc-0.4/-lglib-2.0 -lpcre2-8 -lorc-0.4/' \
            src/VideoReceiver/VideoReceiver.pri

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version:      ${{ env.QT_VERSION }}
          host:         linux
          target:       android
          dir:          ${{ runner.temp }}
          modules:      qtcharts

      - name: Install ccache
        run:  sudo apt-get install ccache

      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        run: echo "timestamp=$(date -u +'%Y-%m-%d-%H;%M;%S')" >> $GITHUB_OUTPUT

      - name: ccache cache files
        uses: actions/cache@v4
        with:
          path:         ~/.ccache
          key:          ${{ runner.os }}-ccache-${{steps.ccache_cache_timestamp.outputs.timestamp}}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Setup ccache
        run: |
            mkdir -p ~/.ccache
            echo "base_dir = ${GITHUB_WORKSPACE}" > ~/.ccache/ccache.conf
            echo "compression = true" >> ~/.ccache/ccache.conf
            echo "compression_level = 5" >> ~/.ccache/ccache.conf
            ccache -s
            ccache -z

      - name: Create build directory
        run:  mkdir ${{ runner.temp }}/shadow_build_dir

      - name: Install gstreamer
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          GSTREAMER_DIR="gstreamer-1.0-android-universal-1.18.5"
          DOWNLOADED=0
          for URL in \
            "https://gstreamer.freedesktop.org/data/pkg/android/1.22.12/gstreamer-1.0-android-universal-1.22.12.tar.xz" \
            "https://gstreamer.freedesktop.org/data/pkg/android/1.22.11/gstreamer-1.0-android-universal-1.22.11.tar.xz" \
            "https://gstreamer.freedesktop.org/data/pkg/android/1.22.10/gstreamer-1.0-android-universal-1.22.10.tar.xz" \
            "https://gstreamer.freedesktop.org/data/pkg/android/1.18.6/gstreamer-1.0-android-universal-1.18.6.tar.xz" \
            "https://gstreamer.freedesktop.org/data/pkg/android/1.18.5/gstreamer-1.0-android-universal-1.18.5.tar.xz"; do
            echo "Trying $URL ..."
            if wget --quiet --tries=2 --timeout=120 "$URL" -O gstreamer-android.tar.xz; then
              echo "Downloaded from $URL"
              DOWNLOADED=1
              break
            fi
          done
          if [ "$DOWNLOADED" -eq 0 ]; then
            echo "ERROR: Could not download GStreamer from any URL" && exit 1
          fi
          mkdir "$GSTREAMER_DIR"
          tar xf gstreamer-android.tar.xz -C "$GSTREAMER_DIR"

      - name: Git branch name
        run: |
          echo "GIT_BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_ENV

      - name: Update android manifest
        run: |
          if [ "$GIT_BRANCH_NAME" != "Stable*" ]; then
            ${SOURCE_DIR}/tools/update_android_manifest_package.sh ${GIT_BRANCH_NAME}
          fi

      - name: Build
        working-directory: ${{ runner.temp }}/shadow_build_dir
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run:  |
            qmake -r ${SOURCE_DIR}/qgroundcontrol.pro -spec android-clang CONFIG+=${BUILD_TYPE} CONFIG+=installer ANDROID_ABIS="arm64-v8a"
            make -j2

      - name: ccache post-run
        run:  ccache -s

      - name: Locate and stage APK
        run: |
          echo "=== Searching for APKs ==="
          find ${{ runner.temp }}/shadow_build_dir -name "*.apk" 2>/dev/null || echo "No APKs found in shadow_build_dir"
          find ${{ github.workspace }} -name "*.apk" 2>/dev/null || echo "No APKs found in workspace"
          echo "=== Listing package dir (if exists) ==="
          ls -la ${{ runner.temp }}/shadow_build_dir/package/ 2>/dev/null || echo "package dir does not exist"
          echo "=== Listing android-build outputs ==="
          find ${{ runner.temp }}/shadow_build_dir -path "*/outputs/apk*" -type f 2>/dev/null || echo "No apk outputs found"
          APK=$(find ${{ runner.temp }}/shadow_build_dir -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo "Found APK at: $APK"
            mkdir -p ${{ runner.temp }}/shadow_build_dir/package
            cp "$APK" ${{ runner.temp }}/shadow_build_dir/package/${{ env.ARTIFACT }}
            echo "Staged to ${{ runner.temp }}/shadow_build_dir/package/${{ env.ARTIFACT }}"
          else
            echo "ERROR: No APK found anywhere after build"
            exit 1
          fi

      - name: Save artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/shadow_build_dir/package/${{ env.ARTIFACT }}

      - name: Upload build to S3 Bucket
        if:                 github.event_name == 'push'
        working-directory:  ${{ runner.temp }}/shadow_build_dir/package
        run: |
              aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
              aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
              aws s3 cp ${ARTIFACT} s3://qgroundcontrol/builds/${GIT_BRANCH_NAME}/${ARTIFACT} --region us-west-2 --acl public-read

      - name: Upload tagged stable build to S3 latest Bucket
        if:                 github.event_name == 'push' && github.ref_type == 'tag'
        working-directory:  ${{ runner.temp }}/shadow_build_dir/package
        run: |
              aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
              aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
              aws s3 cp ${ARTIFACT} s3://qgroundcontrol/latest/${ARTIFACT} --region us-west-2 --acl public-read

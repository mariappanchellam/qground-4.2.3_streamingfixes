# The 32 and 64 bit version of these actions should be kept in sync
name: Android 64-bit Release

on:
  push:
    branches:
      - 'master'
      - 'Stable*'
    tags:
      - 'v*'
  pull_request:
    branches:
    - '*'
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  SOURCE_DIR:   ${{ github.workspace }}
  QT_VERSION:   5.15.2
  ARTIFACT:     QGroundControl64.apk
  BUILD_TYPE:   ${{ fromJSON('["DailyBuild", "StableBuild"]')[ github.ref_type == 'tag' || contains(github.ref, 'Stable_' ) ] }}

jobs:
  build:
    runs-on:  ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get all tags for correct version determination
        working-directory:  ${{ github.workspace }}
        run: |
          git fetch --all --tags -f

      - name: Patch gst-plugins-good volatile gsize for clang
        working-directory: ${{ github.workspace }}
        run: |
          for f in \
            libs/qmlglsink/gst-plugins-good/ext/qt/gstqtglutility.cc \
            libs/qmlglsink/gst-plugins-good/ext/qt/gstqsgtexture.cc \
            libs/qmlglsink/gst-plugins-good/ext/qt/qtwindow.cc \
            libs/qmlglsink/gst-plugins-good/ext/qt/qtitem.cc; do
            sed -i 's/static volatile gsize/static gsize/g' "$f"
          done

      - name: Patch VideoReceiver.pri to add -Bsymbolic for arm64 GStreamer
        working-directory: ${{ github.workspace }}
        run: |
          sed -i 's/QMAKE_CXXFLAGS  += -pthread/QMAKE_CXXFLAGS  += -pthread\n        QMAKE_LFLAGS    += -Wl,-Bsymbolic/' \
            src/VideoReceiver/VideoReceiver.pri

      - name: Install Qt (multi-ABI android)
        uses: jurplel/install-qt-action@v3
        with:
          version:      ${{ env.QT_VERSION }}
          host:         linux
          target:       android
          dir:          ${{ runner.temp }}
          modules:      qtcharts
          cache:        true

      - name: Verify Qt arm64 libraries are present
        run: |
          QT_DIR="${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/android"
          echo "=== Qt arm64 platform plugins ==="
          find "$QT_DIR/plugins" -name "*qtforandroid*" 2>/dev/null || echo "WARNING: no qtforandroid plugins found"
          echo "=== Qt arm64 libs (first 20) ==="
          find "$QT_DIR/lib" -name "*arm64*" 2>/dev/null | sed -n 1,20p
          echo "=== qmake path ==="
          which qmake && qmake --version

      # Qt 5.15.2 androiddeployqt calls "llvm-readobj -needed-libs"; the LLVM in
      # NDK r23+ only accepts "--needed-libs", so dependency scanning fails and
      # androiddeployqt reports "No platform plugin". Wrap llvm-readobj to fix the flag.
      - name: Patch NDK llvm-readobj for Qt 5.15 androiddeployqt
        run: |
          set -e
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [ ! -e "$BIN/llvm-readobj.orig" ]; then
            sudo cp -L "$BIN/llvm-readobj" "$BIN/llvm-readobj.orig"
            sudo rm "$BIN/llvm-readobj"
            sudo tee "$BIN/llvm-readobj" > /dev/null <<'EOF'
          #!/usr/bin/env bash
          args=()
          for a in "$@"; do
            case "$a" in
              -needed-libs) args+=("--needed-libs") ;;
              *) args+=("$a") ;;
            esac
          done
          exec -a "$(basename "$0")" "$(dirname "$(readlink -f "$0")")/llvm-readobj.orig" "${args[@]}"
          EOF
            sudo chmod 755 "$BIN/llvm-readobj"
          fi
          "$BIN/llvm-readobj" -needed-libs "$BIN/llvm-readobj.orig" | sed -n 1,12p
          # AGP 3.6 strips native libs with <triple>-strip, which NDK r23+ replaced with llvm-strip.
          [ -e "$BIN/aarch64-linux-android-strip" ] || sudo ln -s llvm-strip "$BIN/aarch64-linux-android-strip"
          "$BIN/aarch64-linux-android-strip" --version | sed -n 1p

      # Qt 5.15.2's Gradle template only lists google() and jcenter(); add mavenCentral() as a fallback.
      - name: Add mavenCentral to Qt Gradle template
        run: |
          TEMPLATE="${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/android/src/android/templates/build.gradle"
          if ! grep -q mavenCentral "$TEMPLATE"; then
            sed -i 's/^\(\s*\)jcenter()/\1mavenCentral()\n\1jcenter()/' "$TEMPLATE"
          fi
          grep -n "google()\|mavenCentral()\|jcenter()\|tools.build:gradle" "$TEMPLATE"

      # Qt 5.15.2 Gradle template: AGP 3.6.0, Gradle 5.6.4, build-tools 28.0.3.
      - name: Install Android SDK packages for Qt 5.15 packaging
        run: |
          (yes || true) | JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}" "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-30" "build-tools;28.0.3" > /dev/null
          ls "$ANDROID_SDK_ROOT/platforms" "$ANDROID_SDK_ROOT/build-tools"

      # Gradle 5.6.4 does not run on Java 17+.
      - name: Setup Java 11 for Gradle 5.6.4
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install ccache
        run:  sudo apt-get install ccache

      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        run: echo "timestamp=$(date -u +'%Y-%m-%d-%H;%M;%S')" >> $GITHUB_OUTPUT

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path:         ~/.ccache
          key:          ${{ runner.os }}-ccache-${{steps.ccache_cache_timestamp.outputs.timestamp}}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Setup ccache
        run: |
            mkdir -p ~/.ccache
            echo "base_dir = ${GITHUB_WORKSPACE}" > ~/.ccache/ccache.conf
            echo "compression = true" >> ~/.ccache/ccache.conf
            echo "compression_level = 5" >> ~/.ccache/ccache.conf
            ccache -s
            ccache -z

      - name: Create build directory
        run:  mkdir ${{ runner.temp }}/shadow_build_dir

      - name: Restore GStreamer 1.18.6 download
        id: gst_restore
        uses: actions/cache/restore@v4
        with:
          path: gstreamer-android-1.18.6.tar.xz
          key:  gstreamer-1.0-android-universal-1.18.6

      # QGC 4.2.3 (VideoReceiver.pri, GStreamer.cc, android/src/org/freedesktop/gstreamer)
      # targets the GStreamer 1.18 series. 1.18.5 is no longer on gstreamer.freedesktop.org
      # (404), so use 1.18.6, unpacked into the 1.18.5 directory VideoReceiver.pri expects.
      - name: Install gstreamer 1.18.6
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          TARBALL=gstreamer-android-1.18.6.tar.xz
          URL=https://gstreamer.freedesktop.org/data/pkg/android/1.18.6/gstreamer-1.0-android-universal-1.18.6.tar.xz
          if [ ! -s "$TARBALL" ]; then
            for i in 1 2 3 4 5 6; do
              code=$(curl -sSL --connect-timeout 30 --max-time 1200 -o "$TARBALL.part" -w '%{http_code}' "$URL" || echo 000)
              echo "Attempt $i: HTTP $code"
              if [ "$code" = 200 ] && [ -s "$TARBALL.part" ]; then
                mv "$TARBALL.part" "$TARBALL"
                break
              fi
              rm -f "$TARBALL.part"
              sleep $((i * 30))
            done
          fi
          [ -s "$TARBALL" ] || { echo "ERROR: could not download GStreamer 1.18.6 from $URL"; exit 1; }
          mkdir -p gstreamer-1.0-android-universal-1.18.5
          tar xf "$TARBALL" -C gstreamer-1.0-android-universal-1.18.5
          VERSION_H=gstreamer-1.0-android-universal-1.18.5/arm64/include/gstreamer-1.0/gst/gstversion.h
          grep -E "define GST_VERSION_(MAJOR|MINOR|MICRO)" "$VERSION_H"
          grep -qE "define GST_VERSION_MINOR +\(?18\)?" "$VERSION_H" || { echo "ERROR: extracted GStreamer is not 1.18"; exit 1; }

      - name: Save GStreamer 1.18.6 download
        if: steps.gst_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: gstreamer-android-1.18.6.tar.xz
          key:  gstreamer-1.0-android-universal-1.18.6

      - name: Git branch name
        run: |
          echo "GIT_BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_ENV

      - name: Update android manifest
        run: |
          if [ "$GIT_BRANCH_NAME" != "Stable*" ]; then
            ${SOURCE_DIR}/tools/update_android_manifest_package.sh ${GIT_BRANCH_NAME}
          fi

      - name: Build
        working-directory: ${{ runner.temp }}/shadow_build_dir
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run:  |
            qmake -r ${SOURCE_DIR}/qgroundcontrol.pro -spec android-clang CONFIG+=${BUILD_TYPE} CONFIG+=installer ANDROID_ABIS="arm64-v8a"
            make -j2

      - name: ccache post-run
        if: always()
        run:  ccache -s

      # Save even when a later step fails so the next run doesn't recompile everything.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key:  ${{ runner.os }}-ccache-${{steps.ccache_cache_timestamp.outputs.timestamp}}

      - name: Package APK
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: |
          set -e
          make apk_install_target
          SETTINGS=$(ls android-*-deployment-settings.json | sed -n 1p)
          echo "Deployment settings: $SETTINGS"
          androiddeployqt --verbose \
            --input "$SETTINGS" \
            --output "$PWD/android-build" \
            --apk "$PWD/android-build/QGroundControl.apk" \
            --android-platform android-30

      - name: Locate and stage APK
        run: |
          APK="${{ runner.temp }}/shadow_build_dir/android-build/QGroundControl.apk"
          [ -f "$APK" ] || APK=$(find ${{ runner.temp }}/shadow_build_dir -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo "Found APK at: $APK"
            mkdir -p ${{ runner.temp }}/shadow_build_dir/package
            cp "$APK" ${{ runner.temp }}/shadow_build_dir/package/${{ env.ARTIFACT }}
          else
            echo "ERROR: No APK found anywhere after build"
            exit 1
          fi

      - name: Save artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/shadow_build_dir/package/${{ env.ARTIFACT }}

      - name: Upload build to S3 Bucket
        if:                 github.event_name == 'push'
        working-directory:  ${{ runner.temp }}/shadow_build_dir/package
        run: |
              aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
              aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
              aws s3 cp ${ARTIFACT} s3://qgroundcontrol/builds/${GIT_BRANCH_NAME}/${ARTIFACT} --region us-west-2 --acl public-read

      - name: Upload tagged stable build to S3 latest Bucket
        if:                 github.event_name == 'push' && github.ref_type == 'tag'
        working-directory:  ${{ runner.temp }}/shadow_build_dir/package
        run: |
              aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
              aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
              aws s3 cp ${ARTIFACT} s3://qgroundcontrol/latest/${ARTIFACT} --region us-west-2 --acl public-read
